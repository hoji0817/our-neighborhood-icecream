<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}우리동네아이스크림{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="logo">🍦</span> 우리동네<span>아이스크림</span></a>
<nav><a href="{{ url_for('index') }}">상품 찾기</a><a href="{{ url_for('order_lookup') }}">주문 조회</a><a href="{{ url_for('signup') }}">회원가입</a></nav></header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>우리동네아이스크림 · 경기도 동네 아이스크림 배송 <span>테스트용 상품·매장 정보가 포함되어 있습니다.</span></footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
