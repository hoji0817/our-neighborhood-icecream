{% extends "base.html" %}{% block title %}회원가입 · 우리동네아이스크림{% endblock %}
{% block content %}<section class="panel narrow"><h1>회원가입</h1><p class="muted">우리동네아이스크림 회원으로 가입하세요.</p><form method="post"><label>아이디 *<input name="username" required minlength="4" autocomplete="username" placeholder="영문·숫자·밑줄 4자 이상"></label><label>이름 *<input name="name" required autocomplete="name"></label><label>휴대폰 번호 *<input name="phone" type="tel" required autocomplete="tel" placeholder="010-1234-5678"></label><label>비밀번호 *<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="8자 이상"></label><button class="btn full">회원가입하기</button></form><p class="small muted">이미 회원이신가요? <a href="{{ url_for('member_login') }}"><strong>로그인</strong></a></p></section>{% endblock %}
